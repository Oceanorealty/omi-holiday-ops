<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Omi Holiday — Operations{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css?v=ops-checklists-20261021" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <img class="brand-mark" src="/static/omi-mark.png" alt="Omi" />
      <span class="brand-sub">Operations</span>
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" />
    <label for="nav-toggle" class="nav-toggle-btn" aria-label="Menu"><span></span><span></span><span></span></label>
    <nav>
      <a href="/operations/tasks" class="{{ 'active' if request.url.path.startswith('/operations/tasks') else '' }}">Tasks</a>
      <a href="/operations/calendar" class="{{ 'active' if request.url.path == '/operations/calendar' else '' }}">Calendar</a>
      <a href="/operations" class="{{ 'active' if request.url.path == '/operations' else '' }}">Overview</a>
      <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">Bookings</a>
      <a href="/cleaning" class="{{ 'active' if request.url.path == '/cleaning' else '' }}">Cleaning</a>
      <a href="/transactions" class="{{ 'active' if request.url.path == '/transactions' else '' }}">Finance</a>
      <a href="/properties" class="{{ 'active' if request.url.path == '/properties' else '' }}">Properties</a>
      <a href="/pricing" class="{{ 'active' if request.url.path == '/pricing' else '' }}">Pricing</a>
      <a href="/templates" class="{{ 'active' if request.url.path == '/templates' else '' }}">Message Templates</a>
      <a href="/staff" class="{{ 'active' if request.url.path == '/staff' else '' }}">Staff</a>
    </nav>
    <form method="post" action="/logout">
      <button class="logout-btn" type="submit">Sign out</button>
    </form>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
