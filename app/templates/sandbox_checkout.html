<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Test booking — Omi Holiday</title><link rel="stylesheet" href="/static/style.css?v=ops-navigation-20261024"><script src="https://js.stripe.com/v3/" defer></script><script src="/static/sandbox-checkout.js" defer></script></head><body><main class="container"><h1>Test booking · {{ property.name }}</h1><section class="card"><p><strong>Sandbox only. Use a Stripe test card; no real money moves.</strong></p><p>Complete one test at a time. Keep this page open until the signed payment callback confirms the booking. This does not reserve inventory on other booking platforms.</p>
<div data-omi-checkout data-checkout-id="{{ checkout_id }}" data-resume-token="{{ resume_token }}" data-property-id="{{ property.id }}" data-stripe-key="{{ publishable_key }}">
<form data-booking><fieldset><legend>Test stay and guest</legend><label>Check-in <input name="check_in" type="date" required></label><label>Check-out <input name="check_out" type="date" required></label><label>Guests <input name="guests" type="number" min="1" max="100" value="1" required></label><label>Name <input name="name" maxlength="200" required autocomplete="off"></label><label>Email <input name="email" type="email" maxlength="254" required autocomplete="off"></label><label>Language <select name="language"><option value="en">English</option><option value="zh">中文</option></select></label></fieldset><button class="btn" type="submit">Get quote</button></form>
<button class="btn" type="button" data-resume hidden>Resume saved checkout</button><button class="btn" type="button" data-new hidden>Start another test booking</button><p role="status" aria-live="polite"></p><div data-payment></div><button class="btn" type="button" data-pay hidden>Pay with test card</button><button class="btn" type="button" data-check hidden>Check booking status</button>
</div></section></main></body></html>
